; HW2 Frame VR settings. Lives next to opengl32.dll in HomeworldRM\Bin\Release.
; tools\install.ps1 copies this only if the game folder has no hw2vr.ini yet, so local edits survive reinstalls.
; Hotkeys (game window focused, configurable in [hotkeys]): Ctrl+Shift+F8 VR on/off, F10 recentre, PgUp/PgDn world
; scale, F9 flat camera spike.

[debug]
; 1 = log every tracked uniform location and other per-object detail to hw2vr.log
verbose = 0

[vr]
; Single-player and skirmish only - there is no multiplayer guard yet.
; 1 = start VR on the first frame instead of waiting for Ctrl+Shift+F8 (SteamVR must already be running).
autostart = 0
; Game units per real metre: scales eye separation and head movement. Higher = the battlefield feels smaller.
world_scale = 100
; HUD panel distance in metres. The panel spans the game's own field of view at hud_scale = 1, so on-screen
; markers sit over their ships; smaller values shrink it (markers drift off their ships).
hud_distance = 3.0
hud_scale = 1.0
hud_premultiplied = 1

[hotkeys]
; All are Ctrl+Shift+<key>, game window focused. Names: F1-F12, PageUp, PageDown, Home, End, Insert, Delete, A-Z, 0-9.
; If one does nothing, another program may own that combo as a global hotkey: hw2vr.log lists every
; "hotkeys: saw Ctrl+Shift+..." it receives, so a missing line means the key never reached the game.
vr_toggle = F8
recentre = F10
world_scale_up = PageUp
world_scale_down = PageDown
spike = F9

[spike]
; Phase 0 view-override test, flat screen only. Ctrl+Shift+F9 cycles: off -> yaw -> offset -> yaw+offset -> off.
; Camera yaw in degrees.
yaw_degrees = 10
; Sideways camera move in world units (ships are roughly 100-1000 units across).
offset_x = 150
; Mode at game start: off | yaw | offset | yaw+offset
start_mode = off
