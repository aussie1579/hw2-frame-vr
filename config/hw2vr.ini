; HW2 Frame VR settings. Lives next to opengl32.dll in HomeworldRM\Bin\Release.
; tools\install.ps1 copies this only if the game folder has no hw2vr.ini yet, so local edits survive reinstalls.
; Hotkeys (game window focused, configurable in [hotkeys]): Ctrl+Shift+F8 VR on/off, F10 recentre, PgUp/PgDn world
; scale, F9 flat camera spike. Controllers: [controls] and [buttons].

[debug]
; 1 = log every tracked uniform location and other per-object detail to hw2vr.log
verbose = 0
; 1 = capture the HUD and redirect the cursor even without VR (used by tools\smoke-test.ps1)
hud_capture = 0
; non-zero = replay every frame without VR with this view offset (used by tools\smoke-test.ps1)
replay_test_offset_x = 0

[vr]
; Single-player and skirmish only - there is no multiplayer guard yet.
; 1 = start VR on the first frame instead of waiting for Ctrl+Shift+F8 (SteamVR must already be running).
autostart = 0
; sync = both eyes rendered every frame (the frame is replayed for the right eye): smooth, about twice the
; GPU work. afr = alternating eyes, half the work but each eye updates at half rate and moving things judder.
stereo = sync
; Game units per real metre: scales eye separation and head movement. Higher = the battlefield feels smaller.
world_scale = 100
; 1 = while VR runs, move the game window so its client area is fully on its monitor (a windowed game's title bar
; can push the bottom of the UI off-screen, out of the laser's reach). Put back when VR stops.
fit_window = 1
; Where the game's 2D UI goes:
;   aligned = a flat screen spanning the game's own field of view, hud_distance metres away at your head's position
;             (markers sit over their ships; the sharpest the UI gets);
;   panel   = the curved, movable screen of v0.6.0 (shelved: too low resolution to read) - see [panel].
hud = aligned
hud_distance = 3.0
; 1 = exactly the game's field of view; smaller shrinks it (markers then drift off their ships).
hud_scale = 1.0
; 1 = split the game's HUD layer: 2D UI on the HUD screen, 3D overlay in stereo. 0 = leave the HUD in the eye images.
hud_premultiplied = 1
; Recentring happens automatically when you put the headset on; Ctrl+Shift+F10 (or the right stick click) recentres.

[panel]
; Only with [vr] hud = panel. The curved screen with the game's 2D UI. Its look until you move it in VR: point at the
; bar under it and hold the trigger (the sticks then push/pull, resize and curve it). Moving it saves the placement
; to hw2vr_panel.ini, which then wins over these values - delete that file to go back to them.
; Metres in front of you.
distance = 1.8
; Width in degrees, curved round you.
width_degrees = 65
; Metres above (+) or below (-) eye level.
height = -0.1
; Sharpness of the UI image on the panel, in headset pixels per degree. The panel shows a filtered copy at about the
; headset's resolution, because full-size UI on the panel shimmers. 0 = full size.
pixels_per_degree = 20

[controls]
; Steam Frame controllers (rebind in SteamVR > Settings > Controllers > Manage bindings > Homeworld 2 VR).
; Right hand: the laser is the mouse - trigger = left click, bumper = right click, stick up/down = zoom.
;   On the UI the laser clicks the UI; elsewhere it points into the world: the cursor sits where the laser touches
;   a ship (or anything solid) and clicks that. In empty space it stays at the depth it last touched.
; Left hand: stick = orbit the camera (as a right-mouse drag). Other buttons: see [buttons].
stick_deadzone = 0.2
; Orbit speed: mouse movement per second at full stick (the game's own right-drag rotation).
camera_speed = 1200
camera_invert_y = 0
; Zoom speed: mouse-wheel notches per second at full stick.
zoom_notches_per_second = 8
zoom_invert = 0
; The cursor stays still this long after a click, so pressing the trigger doesn't drag it (milliseconds).
click_freeze_ms = 120
; Laser smoothing (1-euro filter, in pixels): lower min_cutoff = steadier when still, higher beta = less lag.
filter_min_cutoff = 1.0
filter_beta = 0.007
haptics = 1
show_beam = 1
; Cursor depth (metres) until the laser first touches something.
cursor_distance = 10

[buttons]
; Each controller button holds a key (or combo) while held, or runs a VR action.
; Keys: A-Z, 0-9, F1-F12, Esc, Space, Tab, Enter, Backspace, Shift, Ctrl, Alt, CapsLock, Up, Down, Left, Right,
;   Home, End, PageUp, PageDown, Insert, Delete, Pause, NumLock, Numpad0-Numpad9, LBracket, RBracket, Slash, Minus,
;   Equals, Comma, Period, Apostrophe, Semicolon, Backslash, Grave. Combos: Ctrl+A, Alt+1, Ctrl+Shift+E.
; VR actions: recentre, world_scale_up, world_scale_down. none = unbound.
; Homeworld 2 default keys: F focus, Esc cancel, Space Sensors Manager, M move, F10 menu, Tab tactical overlay,
;   arrows pan, Shift add to selection / move up-down, Ctrl force attack (Ctrl+number assigns a group), Home focus
;   on the mothership, CapsLock select all visible, B build, R research, L launch, S cancel orders.
; Right hand (A, B, X, Y, Menu, stick click):
a = F
b = Esc
x = Space
y = M
menu = F10
right_stick = recentre
; Left hand (View, D-pad, trigger, bumper, stick click):
view = Tab
dpad_up = Up
dpad_down = Down
dpad_left = Left
dpad_right = Right
left_trigger = Shift
left_bumper = Ctrl
left_stick = Home

[hotkeys]
; All are Ctrl+Shift+<key>, game window focused. Names: F1-F12, PageUp, PageDown, Home, End, Insert, Delete, A-Z, 0-9.
; If one does nothing, another program may own that combo as a global hotkey: hw2vr.log lists every
; "hotkeys: saw Ctrl+Shift+..." it receives, so a missing line means the key never reached the game.
vr_toggle = F8
recentre = F10
world_scale_up = PageUp
world_scale_down = PageDown
spike = F9

[spike]
; Phase 0 view-override test, flat screen only. Ctrl+Shift+F9 cycles: off -> yaw -> offset -> yaw+offset -> off.
; Camera yaw in degrees.
yaw_degrees = 10
; Sideways camera move in world units (ships are roughly 100-1000 units across).
offset_x = 150
; Mode at game start: off | yaw | offset | yaw+offset
start_mode = off
