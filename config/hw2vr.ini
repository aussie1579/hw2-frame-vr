; HW2 Frame VR settings. Lives next to opengl32.dll in HomeworldRM\Bin\Release.
; tools\install.ps1 copies this only if the game folder has no hw2vr.ini yet, so local edits survive reinstalls.
; Hotkeys (game window focused, configurable in [hotkeys]): Ctrl+Shift+F8 VR on/off, F10 recentre, PgUp/PgDn world
; scale, F9 flat camera spike. Controllers: [controls] and [buttons].

[debug]
; 1 = log every tracked uniform location and other per-object detail to hw2vr.log
verbose = 0
; 1 = capture the HUD and redirect the cursor even without VR (used by tools\smoke-test.ps1)
hud_capture = 0
; non-zero = replay every frame without VR with this view offset (used by tools\smoke-test.ps1)
replay_test_offset_x = 0

[vr]
; Single-player and skirmish only - there is no multiplayer guard yet.
; 1 = start VR on the first frame instead of waiting for Ctrl+Shift+F8 (SteamVR must already be running).
autostart = 0
; sync = both eyes rendered every frame (the frame is replayed for the right eye): smooth, about twice the
; GPU work. afr = alternating eyes, half the work but each eye updates at half rate and moving things judder.
stereo = sync
; Game units per real metre: scales eye separation and head movement. Higher = the battlefield feels smaller.
world_scale = 100
; 1 = while VR runs, move the game window so its client area is fully on its monitor (a windowed game's title bar
; can push the bottom of the UI off-screen, out of the laser's reach). Put back when VR stops.
fit_window = 1
; Where the game's screen UI (taskbar, resources, build/research/launch menus) goes:
;   tablet  = our own VR interface: the wrist tablet (left palm towards you) and the D-pad's command menus;
;             the game's build/research/launch window appears beside the tablet while open, its resource readout
;             above it, its right-click menu where you pointed, and the whole screen UI in front only while a menu
;             or dialog is up - see [tablet];
;   console = a curved console below your view, tilted towards you like a dashboard - see [console];
;   aligned = a flat screen spanning the game's own field of view, hud_distance metres away at your head's position;
;   panel   = the curved, movable screen of v0.6.0 (shelved: too low resolution to read) - see [panel].
; Readability: raise the game's own HUD scale (Options > UI: selection, command, top menus, utility icons,
; bottom middle; up to 2.5x). The console has far fewer pixels per degree than a monitor.
hud = tablet
; 1 = the game's world markers (selection circles, brackets, health bars, ship names, tactical icons) are drawn in
; the world at the depth of the ship they belong to; 0 = they go with the screen UI.
world_markers = 1
; aligned layout only:
hud_distance = 3.0
; 1 = exactly the game's field of view; smaller shrinks it (markers then drift off their ships).
hud_scale = 1.0
; 1 = split the game's HUD layer: 2D UI on the HUD screen, 3D overlay in stereo. 0 = leave the HUD in the eye images.
hud_premultiplied = 1
; Recentring happens automatically when you put the headset on; Ctrl+Shift+F10 (or the right stick click) recentres.

[tablet]
; Only with [vr] hud = tablet. Turn your left palm towards your face to bring up the tablet; point at its buttons with
; the right-hand laser and press the bumper. Its buttons send the game's own hotkeys: Sensors Manager (Space), select
; all visible (CapsLock), focus on the mothership (Home), menu (F10) and groups 1-0 - hold the left bumper (Ctrl)
; while pressing a group to assign the selection to it. Everything else is in the D-pad's menus (see [buttons]).
; Width in metres, and how far above the palm it floats.
width = 0.32
lift = 0.11
; Which way the palm faces in the controller's grip pose: +x (OpenXR convention), -x, +y, -y, +z, -z. If the tablet
; shows up when your palm faces away, try -x.
palm_axis = +x
; 1 = show the tablet all the time (to try it out, or if the palm detection doesn't suit you).
always = 0
; The game windows the VR interface shows, as screen rectangles u0, v0, u1, v1 (0..1, from the top-left):
;   status_region - the resource readout (top right), shown above the tablet;
;   manager_region - where the build / research / launch window opens (a column down the right side); shown beside
;                    the tablet, at manager_width metres wide, while it's open;
;   menu_region - the middle of the screen: when a menu or dialog covers it, the whole screen UI appears in front,
;                 menu_distance metres away and menu_width_degrees wide, until it closes.
status_region = 0.75, 0.0, 1.0, 0.07
manager_region = 0.855, 0.06, 1.0, 0.86
manager_width = 0.30
menu_region = 0.3, 0.3, 0.7, 0.7
menu_distance = 2.0
menu_width_degrees = 90

[console]
; Only with [vr] hud = console. Its place until you move it in VR: point at the bar above it and hold the trigger
; (the sticks then push/pull, resize and curve it). Moving it saves the placement to hw2vr_console.ini, which then
; wins over these values - delete that file to go back to them.
; Metres in front of you.
distance = 0.85
; Width in degrees, curved round you.
width_degrees = 80
; Metres above (+) or below (-) eye level.
height = -0.42
; Opacity of the dark surface behind the UI (0 = see-through, 1 = solid).
backing = 0.6

[panel]
; Only with [vr] hud = panel. The curved screen with the game's 2D UI. Its look until you move it in VR: point at the
; bar under it and hold the trigger (the sticks then push/pull, resize and curve it). Moving it saves the placement
; to hw2vr_panel.ini, which then wins over these values - delete that file to go back to them.
; Metres in front of you.
distance = 1.8
; Width in degrees, curved round you.
width_degrees = 65
; Metres above (+) or below (-) eye level.
height = -0.1
; Sharpness of the UI image on the panel, in headset pixels per degree. The panel shows a filtered copy at about the
; headset's resolution, because full-size UI on the panel shimmers. 0 = full size.
pixels_per_degree = 20

[controls]
; Steam Frame controllers (rebind in SteamVR > Settings > Controllers > Manage bindings > Homeworld 2 VR).
; Right hand points: the cursor sits where the laser touches a ship (or anything solid); on a game window it is on
;   the UI. Bumper = left click (select, drag a box, click buttons). Trigger (a light pull) = right click: a tap opens
;   the game's right-click menu, shown where you pointed; hold it and move the laser to turn the camera, as with a
;   right-mouse drag. Stick up/down = zoom, A = move, B = cancel, X = focus, Y = Sensors Manager.
; Left hand: stick = orbit the camera (as a right-mouse drag), trigger = Shift, bumper = Ctrl, View = tactical overlay.
;   D-pad, held: a command menu opens on the laser - point at a slice and let go (or click it): up = orders (move,
;   attack, guard, dock, stop... on what the laser pointed at), left = tactics and stances, right = formations,
;   down = fleet (build, research, launch, build queue, events, objectives, Sensors Manager, menu). See [buttons].
stick_deadzone = 0.2
; Orbit speed: mouse movement per second at full stick (the game's own right-drag rotation).
camera_speed = 450
; Stick response: 1 = linear, 2 = gentle near the centre for fine adjustments (full speed at the edge either way).
camera_curve = 2
camera_invert_y = 0
; Zoom speed: mouse-wheel notches per second at full stick.
zoom_notches_per_second = 8
zoom_invert = 0
; How far (0..1) a trigger must be pulled to count as pressed, and let go to count as released.
trigger_press = 0.25
trigger_release = 0.15
; A press holds the cursor where it went down until the laser moves this many degrees - so a click never becomes a
; tiny drag - then it drags (box select, move-order height...).
drag_degrees = 1.5
; Turning the camera with the trigger: it starts once the laser has moved this many degrees with the trigger held
; (less than that is a right click), then every degree the laser turns moves the mouse swivel_speed counts.
swivel_degrees = 2.0
swivel_speed = 12
swivel_invert_x = 0
swivel_invert_y = 0
; The cursor stays still this long after a release (milliseconds).
click_freeze_ms = 80
; Laser smoothing (1-euro filter, in pixels): lower min_cutoff = steadier when still, higher beta = less lag.
filter_min_cutoff = 1.0
filter_beta = 0.007
haptics = 1
show_beam = 1
; Cursor depth (metres) until the laser first touches something.
cursor_distance = 10

[buttons]
; Each controller button holds a key (or combo) while held, runs a VR action, or opens a command menu while held.
; Keys: A-Z, 0-9, F1-F12, Esc, Space, Tab, Enter, Backspace, Shift, Ctrl, Alt, CapsLock, Up, Down, Left, Right,
;   Home, End, PageUp, PageDown, Insert, Delete, Pause, NumLock, Numpad0-Numpad9, LBracket, RBracket, Slash, Minus,
;   Equals, Comma, Period, Apostrophe, Semicolon, Backslash, Grave. Combos: Ctrl+A, Alt+1, Ctrl+Shift+E.
; VR actions: recentre, world_scale_up, world_scale_down. Menus: menu:orders, menu:tactics, menu:formations,
;   menu:production. none = unbound. (The right trigger and bumper are the mouse buttons, not set here.)
; Homeworld 2 default keys: M move, Esc cancel, F focus, Space Sensors Manager, F10 menu, Tab tactical overlay,
;   B build, R research, L launch, S stop (cancel orders), Shift add to selection / move up-down, Ctrl force attack
;   (Ctrl+number assigns a group), Home focus on the mothership, CapsLock select all visible, arrows pan the camera.
; Right hand (A, B, X, Y, Menu, stick click): the orders you give to what the laser points at.
a = M
b = Esc
x = F
y = Space
menu = F10
right_stick = recentre
; Left hand (View, D-pad, trigger, bumper, stick click): modifiers and the command menus.
view = Tab
dpad_up = menu:orders
dpad_right = menu:formations
dpad_left = menu:tactics
dpad_down = menu:production
left_trigger = Shift
left_bumper = Ctrl
left_stick = Home

[hotkeys]
; All are Ctrl+Shift+<key>, game window focused. Names: F1-F12, PageUp, PageDown, Home, End, Insert, Delete, A-Z, 0-9.
; If one does nothing, another program may own that combo as a global hotkey: hw2vr.log lists every
; "hotkeys: saw Ctrl+Shift+..." it receives, so a missing line means the key never reached the game.
vr_toggle = F8
recentre = F10
world_scale_up = PageUp
world_scale_down = PageDown
spike = F9

[spike]
; Phase 0 view-override test, flat screen only. Ctrl+Shift+F9 cycles: off -> yaw -> offset -> yaw+offset -> off.
; Camera yaw in degrees.
yaw_degrees = 10
; Sideways camera move in world units (ships are roughly 100-1000 units across).
offset_x = 150
; Mode at game start: off | yaw | offset | yaw+offset
start_mode = off
